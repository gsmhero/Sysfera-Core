name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, zip, sodium
      - name: Lint
        run: |
          fail=0
          for f in $(find . -name '*.php' -not -path './dist/*' -not -name 'container.tpl.php'); do php -l "$f" > /dev/null || fail=1; done
          exit $fail
      - name: Tests (no database needed)
        run: php tests/run.php
      - name: WMS tests
        run: php tests/wms.php
      - name: Build packages
        run: php tools/build.php
      - name: Packages are valid zips
        run: |
          unzip -tq dist/sysfera-*.zip
          unzip -tq dist/updates/core-*.zip
          php -r '$m = json_decode(file_get_contents("dist/updates/manifest.json"), true); if (empty($m["core"]["sha256"])) exit(1);'
      - name: Single-file installer unpacks
        run: |
          mkdir /tmp/sf && cp dist/sysfera-install.php /tmp/sf/ && cd /tmp/sf
          php -r '$_SERVER["REQUEST_METHOD"]="POST"; ob_start(); include "sysfera-install.php";' || true
          test -f /tmp/sf/core/app/bootstrap.php && test -f /tmp/sf/install.php && test -f /tmp/sf/index.php
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.3'
        with:
          name: sysfera-dist
          path: dist/
